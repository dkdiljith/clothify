name: Clothify CI

on:
  push:
    branches:
      - main
      - dkdiljith

  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Docker image
        run: docker build -t clothify-app:ci .

  ssh-test:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH connection to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$EC2_SSH_KEY" > ~/.ssh/clothify.pem
          chmod 600 ~/.ssh/clothify.pem

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/clothify.pem "$EC2_USER@$EC2_HOST" \
            "echo 'SSH connection successful'; hostname; whoami"